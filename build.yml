name: Build Minecraft AI Companion

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build mod
        run: gradle build --no-daemon

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4

              - name: Inspect mod JAR
        run: |
          echo "=== Generated files ==="
          ls -lh build/libs/
          echo "=== JAR contents ==="
          jar tf build/libs/*.jar
        with:
          name: ai-companion-forge-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
